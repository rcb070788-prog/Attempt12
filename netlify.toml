[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://hovdckksdjofgghaxtif.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_Vu-tQ4qH76LqelXKlnHV4g_R9F__wkn"

# Canonical origin: redirect www to non-www so browser tab and PWA share storage.
# Replace YOUR_SITE_NAME with your Netlify site name (e.g. attempt12 or your custom subdomain).
[[redirects]]
  from = "/*"
  to = "https://concernedcitizens.netlify.app/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.concernedcitizens.netlify.app"]}

# Canonical origin for custom domain: redirect www to apex (PWA and storage)
[[redirects]]
  from = "/*"
  to = "https://concernedcitizensofmc.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.concernedcitizensofmc.com"]}

# Don't cache index.html so new deploys are picked up quickly (especially on mobile)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Manifest MIME type for PWA installability
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Support for the "Drop Folder" dashboards
[[redirects]]
  from = "/dashboards/*"
  to = "/dashboards/:splat"
  status = 200

# Serve Vite build assets (must be before the SPA catch-all)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Serve root static files from publish dir (so SPA catch-all does not return index.html)
[[redirects]]
  from = "/homescreen.png"
  to = "/homescreen.png"
  status = 200
[[redirects]]
  from = "/icon-192.png"
  to = "/icon-192.png"
  status = 200
[[redirects]]
  from = "/icon-512.png"
  to = "/icon-512.png"
  status = 200
[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

# Pass through Vite dev server paths (must be before SPA catch-all)
# Without these, Netlify dev rewrites /src/* and /@vite/* to index.html, causing MIME type errors
[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200
[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200
[[redirects]]
  from = "/@id/*"
  to = "/@id/:splat"
  status = 200
[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

# Ensure function requests reach the serverless runtime (before SPA catch-all)
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# General SPA redirect (keeps the React app working on refresh)
# This MUST stay at the bottom
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200